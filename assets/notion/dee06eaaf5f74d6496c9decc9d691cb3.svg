<text x="848" y="383" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">相机速度 velocity6 · Linear 4096→6</text>
<text x="848" y="417" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">[B,24,6]；x / y / z / yaw / pitch / roll</text>
<text x="848" y="447" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">逐桶 masked Smooth-L1</text>
<rect x="824" y="505" width="620" height="120" rx="16" fill="#eaf7f0" stroke="#9dceb3" stroke-width="2"/>
<text x="848" y="543" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">MotionScore · Linear 4096→1</text>
<text x="848" y="577" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">桶特征全窗平均 → [B]</text>
<text x="848" y="607" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">窗口级 masked Smooth-L1</text>
<rect x="824" y="665" width="620" height="120" rx="16" fill="#fff4e7" stroke="#e5be89" stroke-width="2"/>
<text x="848" y="703" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">人工 shake · Linear 4096→1</text>
<text x="848" y="737" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">桶特征全窗平均 → [B] logits</text>
<text x="848" y="767" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">epoch 尾冻结主干，独立拟合 60 轮</text>
<rect x="824" y="825" width="620" height="120" rx="16" fill="#fff4e7" stroke="#e5be89" stroke-width="2"/>
<text x="848" y="863" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">变焦 zoom · Linear 4096→2</text>
<text x="848" y="897" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">[B,24,2] logits；zoom-in / zoom-out</text>
<text x="848" y="927" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">主循环 clip 监督；轮末人工拟合 60 轮</text>
<rect x="52" y="955" width="650" height="100" rx="16" fill="#eef0f4" stroke="#bdc4cf" stroke-width="2"/>
<text x="76" y="993" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">原 Minecraft pi_head 保留并冻结</text>
<text x="76" y="1027" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">不参与本项目五头 forward</text>
<text x="52" y="1115" font-size="22" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">初始化：4x_idm；128²→96×128 的 dense / norm 参数做空间插值。</text>
<text x="52" y="1155" font-size="22" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">主训练：backbone + motion / velocity / score / zoom；轮末人工 shake / zoom 独立拟合。</text>
</svg>
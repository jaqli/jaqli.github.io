<polyline points="760,405 824,405" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="760,565 824,565" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="760,725 824,725" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="760,830 760,885 824,885" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="824" y="185" width="620" height="120" rx="16" fill="#eaf7f0" stroke="#9dceb3" stroke-width="2"/>
<text x="848" y="223" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">主动作 motion18 · Linear 4096→18</text>
<text x="848" y="257" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">[B,24,18] logits；平移/转向/special/shake/roll</text>
<text x="848" y="287" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">逐桶 masked BCE + clip 级弱监督</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200"><rect width="1500" height="1200" fill="#f7f9fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<text x="52" y="62" font-size="34" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">VPT-IDM · v1.1 five-head · ep000</text>
<text x="52" y="105" font-size="23" font-family="Noto Sans CJK SC, sans-serif" fill="#52637b">24 fps / 144 frames / 96×128 → 24 buckets × 250 ms</text>
<rect x="52" y="145" width="650" height="110" rx="16" fill="#eaf1ff" stroke="#a6bee9" stroke-width="2"/>
<text x="76" y="183" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">输入 RGB uint8</text>
<text x="76" y="217" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">[B,144,3,96,128]；采样窗口 6.0 秒</text>
<polyline points="377,255 377,285" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="52" y="285" width="650" height="110" rx="16" fill="#eaf1ff" stroke="#a6bee9" stroke-width="2"/>
<text x="76" y="323" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">时间 Conv3D Stem</text>
<text x="76" y="357" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">3→128 通道；kernel=5×1×1；padding=2×0×0</text>
<polyline points="377,395 377,425" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="52" y="425" width="650" height="145" rx="16" fill="#eaf1ff" stroke="#a6bee9" stroke-width="2"/>
<text x="76" y="463" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">逐帧 Impala 残差 CNN</text>
<text x="76" y="497" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">256 / 512 / 512 通道，三次空间下采样</text>
<text x="76" y="527" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">96×128 → 12×16；Flatten → Dense 256 → 4096</text>
<polyline points="377,570 377,600" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="52" y="600" width="650" height="145" rx="16" fill="#eaf1ff" stroke="#a6bee9" stroke-width="2"/>
<text x="76" y="638" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">非因果时间 Transformer ×2</text>
<text x="76" y="672" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">hidden=4096，32 heads，FFN ratio=4</text>
<text x="76" y="702" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">同窗可见过去/未来；输出 [B,144,4096]</text>
<polyline points="377,745 377,775" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="52" y="775" width="650" height="110" rx="16" fill="#eaf1ff" stroke="#a6bee9" stroke-width="2"/>
<text x="76" y="813" font-size="24" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f" font-weight="700">每 6 帧平均池化</text>
<text x="76" y="847" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#15253f">共享桶特征 [B,24,4096]</text>
